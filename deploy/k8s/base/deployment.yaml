apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketstars
  labels:
    app.kubernetes.io/name: marketstars
    app.kubernetes.io/component: web
    marketstars.io/phase: app
spec:
  # replicas is intentionally omitted: the HPA owns it (minReplicas >= 2).
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: marketstars
      app.kubernetes.io/component: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marketstars
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: marketstars
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: marketstars
              app.kubernetes.io/component: web
      initContainers:
        # Native sidecar (restartPolicy: Always, k8s >= 1.29): starts before the
        # app, stays up for the Pod's lifetime, stops after the app container.
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
          restartPolicy: Always
          args:
            - --private-ip
            - --port=3306
            - --address=127.0.0.1
            - --structured-logs
            - --health-check
            - --http-address=0.0.0.0
            - --http-port=9090
            - --exit-zero-on-sigterm
            - $(CLOUD_SQL_INSTANCE)
          env:
            - name: CLOUD_SQL_INSTANCE
              valueFrom:
                configMapKeyRef: { name: marketstars-config, key: CLOUD_SQL_INSTANCE }
          ports:
            - { name: proxy-health, containerPort: 9090 }
          startupProbe:
            httpGet: { path: /startup, port: proxy-health }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /liveness, port: proxy-health }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      containers:
        - name: app
          image: marketstars # replaced by overlay `images:`
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3000 }
          env:
            # Kubelet sets HOSTNAME to the pod name; Next.js standalone binds to
            # $HOSTNAME, so force all interfaces.
            - { name: HOSTNAME, value: "0.0.0.0" }
            - { name: PORT, value: "3000" }
          envFrom:
            - configMapRef: { name: marketstars-config }
            - secretRef: { name: marketstars-secrets }
          startupProbe:
            httpGet: { path: /api/healthz, port: http }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: { path: /api/healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /api/readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            # Give the LB / NEG time to stop sending traffic before SIGTERM.
            preStop:
              exec: { command: ["sleep", "20"] }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: next-cache, mountPath: /app/.next/cache }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 256Mi } }
        - { name: next-cache, emptyDir: { sizeLimit: 512Mi } }

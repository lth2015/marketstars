# Secrets come from GCP Secret Manager via External Secrets Operator (ESO >= v0.17,
# API external-secrets.io/v1). Each environment lives in its own GCP project, so
# the Secret Manager secret names are identical across environments; only the
# projectID / cluster info differs (patched per overlay).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-secret-manager
  labels:
    marketstars.io/phase: prereq
spec:
  provider:
    gcpsm:
      projectID: PROJECT_ID
      auth:
        workloadIdentity:
          clusterLocation: asia-northeast1
          clusterName: CLUSTER_NAME
          serviceAccountRef:
            name: marketstars
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: marketstars-secrets
  labels:
    marketstars.io/phase: prereq
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-secret-manager
  target:
    name: marketstars-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: marketstars-database-url }
    - secretKey: SESSION_SECRET
      remoteRef: { key: marketstars-session-secret }
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef: { key: marketstars-oidc-client-secret }
    - secretKey: JOB_TOKEN
      remoteRef: { key: marketstars-job-token }
    - secretKey: LAUNCH_CLIENT_SECRET_POP_WRITER
      remoteRef: { key: marketstars-launch-client-secret-pop-writer }
    - secretKey: LAUNCH_CLIENT_SECRET_REVIEW_REPLY
      remoteRef: { key: marketstars-launch-client-secret-review-reply }
    - secretKey: PAYMENT_WEBHOOK_SECRET
      remoteRef: { key: marketstars-payment-webhook-secret }
    # 统一模型网关（未设置时网关使用 mock 模型）
    - secretKey: ANTHROPIC_API_KEY
      remoteRef: { key: marketstars-anthropic-api-key }

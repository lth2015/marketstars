# One-shot DB migration (forward-only). Jobs are immutable: delete the previous
# one before applying a new image (see docs/deploy.md). The Cloud SQL proxy is a
# native sidecar, so the Job completes when `prisma migrate deploy` exits.
apiVersion: batch/v1
kind: Job
metadata:
  name: marketstars-migrate
  labels:
    app.kubernetes.io/name: marketstars
    app.kubernetes.io/component: migration
    marketstars.io/phase: migrate
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marketstars
        app.kubernetes.io/component: migration
    spec:
      serviceAccountName: marketstars
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
          restartPolicy: Always
          args:
            - --private-ip
            - --port=3306
            - --address=127.0.0.1
            - --structured-logs
            - --health-check
            - --http-address=0.0.0.0
            - --http-port=9090
            - --exit-zero-on-sigterm
            - $(CLOUD_SQL_INSTANCE)
          env:
            - name: CLOUD_SQL_INSTANCE
              valueFrom:
                configMapKeyRef: { name: marketstars-config, key: CLOUD_SQL_INSTANCE }
          ports:
            - { name: proxy-health, containerPort: 9090 }
          startupProbe:
            httpGet: { path: /startup, port: proxy-health }
            periodSeconds: 2
            failureThreshold: 30
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      containers:
        - name: migrate
          image: marketstars # replaced by overlay `images:`
          command: ["prisma", "migrate", "deploy", "--schema=prisma/schema.prisma"]
          env:
            - { name: HOME, value: /tmp }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: marketstars-secrets, key: DATABASE_URL }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }

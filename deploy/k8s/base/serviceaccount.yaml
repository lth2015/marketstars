# KSA used by the web Deployment, the migration Job and the ESO SecretStore.
# Bound to a GSA through Workload Identity (see deploy/gcp/README.md).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: marketstars
  labels:
    marketstars.io/phase: prereq
  annotations:
    iam.gke.io/gcp-service-account: marketstars-app@PROJECT_ID.iam.gserviceaccount.com # patched per overlay

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# dev: GCP project marketstars-dev, GKE Autopilot cluster marketstars-dev (asia-northeast1).
resources:
  - ../../base

labels:
  - pairs:
      marketstars.io/env: dev
    includeSelectors: false

images:
  - name: marketstars
    newName: asia-northeast1-docker.pkg.dev/SHARED_PROJECT_ID/marketstars/app
    newTag: dev-latest # CI sets this: kustomize edit set image marketstars=...:<git-sha>

configMapGenerator:
  - name: marketstars-config
    behavior: merge
    literals:
      - AUTH_MODE=demo   # demo login allowed ONLY in dev
      - APP_BASE_URL=https://dev.marketstars.example.com
      - OIDC_REDIRECT_URI=https://dev.marketstars.example.com/auth/callback
      - OIDC_ISSUER=https://auth.sso-dev.example.com/
      - OIDC_CLIENT_ID=marketstars-dev
      - SSO_API_BASE_URL=https://api.sso-dev.example.com
      - SSO_API_AUDIENCE=https://api.sso-dev.example.com
      - SSO_ACCOUNT_URL=https://auth.sso-dev.example.com/account
      - SSO_CONSOLE_URL=https://auth.sso-dev.example.com/console
      - SSO_LOGOUT_URL=https://auth.sso-dev.example.com/sso/logout
      - OPERATOR_SSO_TENANT_ID=REPLACE_ME_DEV_TENANT_ID
      - CLOUD_SQL_INSTANCE=marketstars-dev:asia-northeast1:marketstars-db

patches:
  - target: { kind: ServiceAccount, name: marketstars }
    patch: |-
      - op: replace
        path: /metadata/annotations/iam.gke.io~1gcp-service-account
        value: marketstars-app@marketstars-dev.iam.gserviceaccount.com
  - target: { kind: SecretStore, name: gcp-secret-manager }
    patch: |-
      - op: replace
        path: /spec/provider/gcpsm/projectID
        value: marketstars-dev
      - op: replace
        path: /spec/provider/gcpsm/auth/workloadIdentity/clusterName
        value: marketstars-dev
  - target: { kind: HTTPRoute }
    patch: |-
      - op: replace
        path: /spec/hostnames
        value: ["dev.marketstars.example.com"]
  - target: { kind: HorizontalPodAutoscaler, name: marketstars }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
